services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: anxiety-entropy-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/anxiety-entropy.db
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - anxiety-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: anxiety-entropy-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - anxiety-network

volumes:
  backend-data:
    name: anxiety-entropy-sqlite-data

networks:
  anxiety-network:
    name: anxiety-entropy-net
